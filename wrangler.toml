# Cloudflare Workers configuration for Smart Email Automation
name = "smart-email-automation"
main = "src/worker.py"
compatibility_date = "2026-08-01"
compatibility_flags = ["python_workers", "disable_python_external_sdk"]

# Static Assets - serves frontend files, Worker handles API routes first
[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "smart-email-automation-db"
database_id = "2b92f6be-539d-4f57-a277-251ca2a04a3e"

# Environment variables
[vars]
APP_ENV = "production"
CLOUDFLARE_WORKER = "1"
