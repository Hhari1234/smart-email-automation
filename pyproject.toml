[project]
name = "smart-email-automation"
version = "1.0.0"
description = "Smart Email Automation - Cloudflare Workers deployment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1.0",
    "itsdangerous>=2.1.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "workers-py>=1.9.0",
    "workers-runtime-sdk>=1.0.0",
]
