# Render deployment configuration for ResumeMailer (Python FastAPI backend).
#
# This deploys a long-running Python web service with HTTPS, environment
# variables, and a persistent disk for the SQLite database + uploads.
#
# Deploy via the Render dashboard: https://dashboard.render.com
# Or with the Render CLI: `render deploy`

services:
  - type: web
    name: smart-email-automation
    region: oregon
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1

    # Persistent disk for SQLite DB + uploaded files + logs.
    disk:
      name: resumemailer-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: APP_ENV
        value: production

      # REQUIRED: Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: APP_SECRET_KEY
        generateValue: true

      - key: APP_SESSION_HOURS
        value: "12"

      - key: RESUMEMAILER_DATA_DIR
        value: /var/data

      # Optional: SMTP configuration for email sending
      - key: SMTP_EMAIL
        sync: false

      - key: SMTP_APP_PASSWORD
        sync: false

      - key: GMAIL_CREDENTIALS_FILE
        sync: false

      - key: GMAIL_TOKEN_FILE
        sync: false
