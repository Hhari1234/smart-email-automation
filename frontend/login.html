<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ResumeMailer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <div class="bg-aurora">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <span>Smart Email Automation</span>
      </div>

      <div id="signin-panel">
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Sign in to access your dashboard.</p>

        <form id="login-form" class="login-form" autocomplete="on" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input"
                   autocomplete="username" autocapitalize="none" spellcheck="false" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" class="form-input"
                     autocomplete="current-password" required />
              <button type="button" class="password-toggle" data-target="password" tabindex="-1">
                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-error" id="form-error" hidden></div>

          <button type="submit" class="btn btn-primary btn-lg" id="login-btn">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader" hidden></span>
          </button>
        </form>

        <p class="login-toggle">
          Don't have an account? <a href="#" id="show-register">Create Account</a>
        </p>
      </div>

      <div id="register-panel" hidden>
        <h1 class="login-title">Create your account</h1>
        <p class="login-subtitle">Set up your account to access your dashboard.</p>

        <form id="register-form" class="login-form" autocomplete="off" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-username">Username</label>
            <input type="text" id="reg-username" name="username" class="form-input"
                   autocomplete="username" autocapitalize="none" spellcheck="false" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="reg-password" name="password" class="form-input"
                     autocomplete="new-password" required />
              <button type="button" class="password-toggle" data-target="reg-password" tabindex="-1">
                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password</label>
            <div class="password-wrapper">
              <input type="password" id="reg-confirm" name="confirm_password" class="form-input"
                     autocomplete="new-password" required />
              <button type="button" class="password-toggle" data-target="reg-confirm" tabindex="-1">
                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-error" id="register-error" hidden></div>

          <button type="submit" class="btn btn-primary btn-lg" id="register-btn">
            <span class="btn-text">Create Account</span>
            <span class="btn-loader" hidden></span>
          </button>
        </form>

        <p class="login-toggle">
          Already have an account? <a href="#" id="show-login">Sign In</a>
        </p>
      </div>

      <p class="login-footer">Protected area. Authorized access only.</p>
    </div>
  </main>

  <script>
    (function () {
      const signinPanel = document.getElementById('signin-panel');
      const registerPanel = document.getElementById('register-panel');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const loginError = document.getElementById('form-error');
      const registerError = document.getElementById('register-error');
      const loginBtn = document.getElementById('login-btn');
      const registerBtn = document.getElementById('register-btn');
      const loginBtnText = loginBtn.querySelector('.btn-text');
      const loginBtnLoader = loginBtn.querySelector('.btn-loader');
      const registerBtnText = registerBtn.querySelector('.btn-text');
      const registerBtnLoader = registerBtn.querySelector('.btn-loader');

      function showError(el, msg) {
        el.textContent = msg;
        el.hidden = !msg;
      }

      function setButtonLoading(btn, textEl, loaderEl, loading) {
        btn.disabled = loading;
        textEl.hidden = loading;
        loaderEl.hidden = !loading;
      }

      function togglePassword(targetId, btn) {
        const input = document.getElementById(targetId);
        const eyeIcon = btn.querySelector('.eye-icon');
        const eyeOffIcon = btn.querySelector('.eye-off-icon');
        if (input.type === 'password') {
          input.type = 'text';
          eyeIcon.style.display = 'none';
          eyeOffIcon.style.display = 'block';
        } else {
          input.type = 'password';
          eyeIcon.style.display = 'block';
          eyeOffIcon.style.display = 'none';
        }
      }

      document.querySelectorAll('.password-toggle').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const targetId = this.getAttribute('data-target');
          if (targetId) {
            togglePassword(targetId, this);
          }
        });
      });

      document.getElementById('show-register').addEventListener('click', function(e) {
        e.preventDefault();
        signinPanel.hidden = true;
        registerPanel.hidden = false;
        showError(loginError, '');
        showError(registerError, '');
      });

      document.getElementById('show-login').addEventListener('click', function(e) {
        e.preventDefault();
        registerPanel.hidden = true;
        signinPanel.hidden = false;
        showError(loginError, '');
        showError(registerError, '');
      });

      fetch('/api/auth/status', { credentials: 'same-origin' })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          if (data && data.authenticated) {
            window.location.replace('/');
          }
        })
        .catch(function() {});

      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        showError(loginError, '');
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        if (!username || !password) {
          showError(loginError, 'Please enter both username and password.');
          return;
        }
        setButtonLoading(loginBtn, loginBtnText, loginBtnLoader, true);
        fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
        .then(function(res) {
          if (res.ok) {
            window.location.replace('/');
            return;
          }
          return res.json().catch(function() { return {}; });
        })
        .then(function(data) {
          if (data) {
            showError(loginError, data.detail || 'Sign in failed. Please try again.');
          }
        })
        .catch(function() {
          showError(loginError, 'Network error. Please try again.');
        })
        .finally(function() {
          setButtonLoading(loginBtn, loginBtnText, loginBtnLoader, false);
        });
      });

      registerForm.addEventListener('submit', function(e) {
        e.preventDefault();
        showError(registerError, '');
        var username = document.getElementById('reg-username').value.trim();
        var password = document.getElementById('reg-password').value;
        var confirmPassword = document.getElementById('reg-confirm').value;
        if (!username || !password || !confirmPassword) {
          showError(registerError, 'Please fill in all fields.');
          return;
        }
        if (password !== confirmPassword) {
          showError(registerError, 'Passwords do not match.');
          return;
        }
        setButtonLoading(registerBtn, registerBtnText, registerBtnLoader, true);
        fetch('/api/auth/register', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: username,
            password: password,
            confirm_password: confirmPassword
          })
        })
        .then(function(res) {
          if (res.ok) {
            window.location.replace('/');
            return;
          }
          return res.json().catch(function() { return {}; });
        })
        .then(function(data) {
          if (data) {
            showError(registerError, data.detail || 'Account creation failed. Please try again.');
          }
        })
        .catch(function() {
          showError(registerError, 'Network error. Please try again.');
        })
        .finally(function() {
          setButtonLoading(registerBtn, registerBtnText, registerBtnLoader, false);
        });
      });
    })();
  </script>
</body>
</html>
