<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Smart Email Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <div class="bg-aurora">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <span>Smart Email Automation</span>
      </div>

      <div id="signin-panel">
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Sign in to access your dashboard.</p>

        <form id="login-form" class="login-form" autocomplete="on" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input"
                   autocomplete="username" autocapitalize="none" spellcheck="false" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" class="form-input"
                     autocomplete="current-password" required />
              <button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false">
                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-error" id="form-error" hidden></div>

          <button type="submit" class="btn btn-primary btn-lg" id="login-btn">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader" hidden></span>
          </button>
        </form>

        <p class="login-toggle">
          Don't have an account? <a href="#" id="show-register">Create Account</a>
        </p>
      </div>

      <div id="register-panel" hidden>
        <h1 class="login-title">Create your account</h1>
        <p class="login-subtitle">Set up your account to access your dashboard.</p>

        <form id="register-form" class="login-form" autocomplete="on" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input type="text" id="reg-name" name="name" class="form-input"
                   autocomplete="name" maxlength="100" required aria-describedby="reg-name-error" />
            <div class="field-error" id="reg-name-error" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" name="email" class="form-input"
                   autocomplete="email" maxlength="254" required aria-describedby="reg-email-error" />
            <div class="field-error" id="reg-email-error" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-username">Username</label>
            <input type="text" id="reg-username" name="username" class="form-input"
                   autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="50"
                   required aria-describedby="reg-username-error" />
            <div class="field-error" id="reg-username-error" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="reg-password" name="password" class="form-input"
                     autocomplete="new-password" required />
               <button type="button" class="password-toggle" data-target="reg-password" aria-label="Show password" aria-pressed="false">
                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <div class="password-strength" id="password-strength" aria-live="polite">
              <div class="strength-track"><span id="strength-bar"></span></div>
              <span id="strength-label">Use 8 or more characters</span>
            </div>
            <div class="field-error" id="reg-password-error" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password</label>
            <div class="password-wrapper">
              <input type="password" id="reg-confirm" name="confirm_password" class="form-input"
                     autocomplete="new-password" required />
               <button type="button" class="password-toggle" data-target="reg-confirm" aria-label="Show password" aria-pressed="false">
                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <div class="field-error" id="reg-confirm-error" role="alert"></div>
          </div>

          <div class="form-error" id="register-error" hidden></div>
          <div class="form-success" id="register-success" role="status" hidden></div>

          <button type="submit" class="btn btn-primary btn-lg" id="register-btn">
            <span class="btn-text">Create Account</span>
            <span class="btn-loader" hidden></span>
          </button>
        </form>

        <p class="login-toggle">
          Already have an account? <a href="#" id="show-login">Sign In</a>
        </p>
      </div>

      <p class="login-footer">Protected area. Authorized access only.</p>
    </div>
  </main>

  <script>
    (function () {
      const signinPanel = document.getElementById('signin-panel');
      const registerPanel = document.getElementById('register-panel');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const loginError = document.getElementById('form-error');
      const registerError = document.getElementById('register-error');
      const registerSuccess = document.getElementById('register-success');
      const loginBtn = document.getElementById('login-btn');
      const registerBtn = document.getElementById('register-btn');
      const registerFields = {
        name: document.getElementById('reg-name'),
        email: document.getElementById('reg-email'),
        username: document.getElementById('reg-username'),
        password: document.getElementById('reg-password'),
        confirm: document.getElementById('reg-confirm')
      };
      const fieldErrors = {
        name: document.getElementById('reg-name-error'),
        email: document.getElementById('reg-email-error'),
        username: document.getElementById('reg-username-error'),
        password: document.getElementById('reg-password-error'),
        confirm: document.getElementById('reg-confirm-error')
      };

      function showMessage(el, msg) {
        el.textContent = msg;
        el.hidden = !msg;
      }

      function setButtonLoading(btn, loading, label) {
        btn.disabled = loading;
        btn.querySelector('.btn-text').hidden = loading;
        btn.querySelector('.btn-loader').hidden = !loading;
        if (loading) btn.setAttribute('aria-label', label);
        else btn.removeAttribute('aria-label');
      }

      function togglePassword(targetId, btn) {
        const input = document.getElementById(targetId);
        const visible = input.type === 'password';
        input.type = visible ? 'text' : 'password';
        btn.querySelector('.eye-icon').style.display = visible ? 'none' : 'block';
        btn.querySelector('.eye-off-icon').style.display = visible ? 'block' : 'none';
        btn.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
        btn.setAttribute('aria-pressed', String(visible));
      }

      function setFieldError(name, message) {
        const input = registerFields[name];
        const error = fieldErrors[name];
        error.textContent = message || '';
        error.hidden = !message;
        input.setAttribute('aria-invalid', String(Boolean(message)));
      }

      function clearRegisterMessages() {
        showMessage(registerError, '');
        showMessage(registerSuccess, '');
        Object.keys(fieldErrors).forEach(function (name) {
          setFieldError(name, '');
        });
      }

      function showPanel(panel, updateUrl) {
        const registration = panel === 'register';
        signinPanel.hidden = registration;
        registerPanel.hidden = !registration;
        showMessage(loginError, '');
        clearRegisterMessages();
        if (updateUrl) {
          window.history.replaceState({}, '', registration ? '/signup' : '/login');
        }
        if (registration) registerFields.name.focus();
        else document.getElementById('username').focus();
      }

      function passwordStrength(password) {
        let score = 0;
        if (password.length >= 8) score++;
        if (password.length >= 12) score++;
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
        if (/\d/.test(password) && /[^A-Za-z0-9]/.test(password)) score++;
        return Math.min(score, 4);
      }

      function updateStrength() {
        const score = passwordStrength(registerFields.password.value);
        const labels = ['Use 8 or more characters', 'Weak', 'Fair', 'Good', 'Strong'];
        const bar = document.getElementById('strength-bar');
        bar.style.width = `${score * 25}%`;
        bar.dataset.score = String(score);
        document.getElementById('strength-label').textContent = labels[score];
      }

      document.querySelectorAll('.password-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          togglePassword(this.getAttribute('data-target'), this);
        });
      });

      document.getElementById('show-register').addEventListener('click', function (e) {
        e.preventDefault();
        showPanel('register', true);
      });
      document.getElementById('show-login').addEventListener('click', function (e) {
        e.preventDefault();
        showPanel('login', true);
      });
      registerFields.password.addEventListener('input', updateStrength);

      fetch('/api/auth/status', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (data && data.authenticated) window.location.replace('/');
        })
        .catch(function () {});

      if (window.location.pathname === '/signup') showPanel('register', false);

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        showMessage(loginError, '');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) {
          showMessage(loginError, 'Please enter both username and password.');
          return;
        }
        setButtonLoading(loginBtn, true, 'Signing in...');
        fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (res) {
            if (res.ok) {
              window.location.replace('/');
              return null;
            }
            return res.json().catch(function () { return {}; });
          })
          .then(function (data) {
            if (data) showMessage(loginError, data.detail || 'Sign in failed. Please try again.');
          })
          .catch(function () { showMessage(loginError, 'Something went wrong. Please try again.'); })
          .finally(function () { setButtonLoading(loginBtn, false, ''); });
      });

      registerForm.addEventListener('submit', function (e) {
        e.preventDefault();
        clearRegisterMessages();
        const name = registerFields.name.value.trim();
        const email = registerFields.email.value.trim().toLowerCase();
        const username = registerFields.username.value.trim().toLowerCase();
        const password = registerFields.password.value;
        const confirmPassword = registerFields.confirm.value;
        let valid = true;

        if (!name) { setFieldError('name', 'Full name is required.'); valid = false; }
        if (!email) {
          setFieldError('email', 'Email address is required.'); valid = false;
        } else if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) {
          setFieldError('email', 'Please enter a valid email address.'); valid = false;
        }
        if (!username) {
          setFieldError('username', 'Username is required.'); valid = false;
        } else if (!/^[a-z0-9_-]{3,50}$/.test(username)) {
          setFieldError('username', 'Use 3–50 letters, numbers, _ or -.'); valid = false;
        }
        if (password.length < 8) {
          setFieldError('password', 'Password must be at least 8 characters.'); valid = false;
        }
        if (password !== confirmPassword) {
          setFieldError('confirm', 'Passwords do not match.'); valid = false;
        }
        if (!valid) return;

        setButtonLoading(registerBtn, true, 'Creating account...');
        fetch('/api/auth/signup', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            email: email,
            username: username,
            password: password,
            confirm_password: confirmPassword
          })
        })
          .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
              return { ok: res.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result.ok) {
              showMessage(registerError, result.data.detail || 'Something went wrong. Please try again.');
              return;
            }
            showMessage(registerSuccess, 'Account created successfully. You can now sign in.');
            setTimeout(function () { showPanel('login', true); }, 900);
          })
          .catch(function () { showMessage(registerError, 'Something went wrong. Please try again.'); })
          .finally(function () { setButtonLoading(registerBtn, false, ''); });
      });
    })();
  </script>
</body>
</html>
